name: Quotii DevSecOps CI

on:
  pull_request:
  push:
    branches:
      - OBI/CI

permissions:
  contents: read

concurrency:
  group: devsecops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for credentials
        run: |
          chmod +x scripts/check-no-secrets.sh
          ./scripts/check-no-secrets.sh

  node-test:
    name: Node Unit and API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: quotiiBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: quotiiBackend/yarn.lock
      - name: Install Node dependencies
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn typecheck
      - name: Node tests
        run: yarn test
      - name: Node coverage
        run: yarn test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: quotiiBackend/coverage/

  python-test:
    name: Python Unit and API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: quotiiPdfProcessor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            quotiiPdfProcessor/requirements.txt
            quotiiPdfProcessor/requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -r . -x ./tests,./.venv
      - name: Pytest and coverage
        run: |
          chmod +x scripts/run-tests.sh
          ./scripts/run-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: quotiiPdfProcessor/coverage.xml

  dependency-scan:
    name: SCA Dependency Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: quotiiBackend/yarn.lock
      - name: Node dependency audit
        working-directory: quotiiBackend
        run: |
          yarn install --frozen-lockfile
          yarn audit --level high
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python dependency audit
        working-directory: quotiiPdfProcessor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip-audit
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: quotii
          path: .
          format: HTML
          out: dependency-check-report
          args: >
            --enableRetired
            --failOnCVSS 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: dependency-check-report/

  trivy-filesystem:
    name: Trivy Filesystem Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  sonarqube:
    name: SonarQube SAST and Quality
    runs-on: ubuntu-latest
    needs:
      - node-test
      - python-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: node-coverage
          path: quotiiBackend/coverage
      - uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: quotiiPdfProcessor
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-images:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - node-test
      - python-test
      - dependency-scan
      - trivy-filesystem
      - sonarqube
    permissions:
      contents: read
    outputs:
      node_image: ${{ steps.meta.outputs.node_image }}
      python_image: ${{ steps.meta.outputs.python_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Docker metadata
        id: meta
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "node_image=ghcr.io/${OWNER}/quotii-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "python_image=ghcr.io/${OWNER}/quotii-pdf-processor:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build Node image
        run: docker build --file quotiiBackend/Dockerfile --tag "${{ steps.meta.outputs.node_image }}" quotiiBackend
      - name: Build Python image
        run: docker build --file quotiiPdfProcessor/Dockerfile --tag "${{ steps.meta.outputs.python_image }}" quotiiPdfProcessor
      - name: Save images
        run: docker save "${{ steps.meta.outputs.node_image }}" "${{ steps.meta.outputs.python_image }}" -o images.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar

  image-scan:
    name: Trivy Container Scan and SBOM
    runs-on: ubuntu-latest
    needs: build-images
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
      - name: Load Docker images
        run: docker load -i images.tar
      - name: Scan Node image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ needs.build-images.outputs.node_image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Scan Python image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ needs.build-images.outputs.python_image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Generate Node SBOM
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ needs.build-images.outputs.node_image }}
          format: cyclonedx
          output: node-sbom.json
          exit-code: 0
      - name: Generate Python SBOM
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ needs.build-images.outputs.python_image }}
          format: cyclonedx
          output: python-sbom.json
          exit-code: 0
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            node-sbom.json
            python-sbom.json

  integration-test:
    name: Docker Compose Smoke and Integration
    runs-on: ubuntu-latest
    needs: image-scan
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install integration test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
      - name: Reset fake object store
        run: rm -rf .ci/object-store && mkdir -p .ci/object-store
      - name: Start integration environment
        run: docker compose -f docker-compose.ci.yml up --build -d
      - name: Wait for services
        run: |
          chmod +x scripts/wait-for-services.sh
          ./scripts/wait-for-services.sh
      - name: API smoke tests
        run: |
          chmod +x tests/smoke/api-smoke.sh
          ./tests/smoke/api-smoke.sh
      - name: HTTP integration tests
        run: pytest tests/integration -q
      - name: Collect logs
        if: always()
        run: docker compose -f docker-compose.ci.yml logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-logs
          path: compose.log
      - name: Shutdown
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  dast-zap:
    name: OWASP ZAP API Security
    runs-on: ubuntu-latest
    needs: integration-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reset fake object store
        run: rm -rf .ci/object-store && mkdir -p .ci/object-store
      - name: Start integration environment
        run: docker compose -f docker-compose.ci.yml up --build -d
      - name: Wait for services
        run: |
          chmod +x scripts/wait-for-services.sh
          ./scripts/wait-for-services.sh
      - name: ZAP API scan for FastAPI OpenAPI
        run: |
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://127.0.0.1:8000/openapi.json -f openapi \
            -r zap-fastapi-report.html -J zap-fastapi-report.json
      - name: ZAP baseline scan for Node backend and GraphQL surface
        run: |
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:3000/ \
            -r zap-backend-report.html -J zap-backend-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: |
            zap-fastapi-report.html
            zap-fastapi-report.json
            zap-backend-report.html
            zap-backend-report.json
      - name: Shutdown
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: dast-zap
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
      - name: Load images
        run: docker load -i images.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable Git SHA images
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          NODE_IMAGE="ghcr.io/${OWNER}/quotii-backend:${GITHUB_SHA}"
          PYTHON_IMAGE="ghcr.io/${OWNER}/quotii-pdf-processor:${GITHUB_SHA}"
          docker push "$NODE_IMAGE"
          docker push "$PYTHON_IMAGE"
