# ---------------------------------------------------------------
# SonarCloud project for quotiiBackend (Node.js / TypeScript)
#
# Required: set these two values in SonarCloud before first run.
#   sonar.organization  — your SonarCloud organization key
#   sonar.projectKey    — the project key you created in SonarCloud
#                         for this service (e.g. <org>_quotii-backend)
# ---------------------------------------------------------------
sonar.organization=jujistu
sonar.projectKey=jujistu_quoti-node
sonar.projectName=quoti-node

# sonar.qualitygate.wait=true requires the SONAR_TOKEN to have Execute Analysis
# permission on the project in SonarCloud. The Quality Gate result is still
# visible in the SonarCloud UI after each analysis. Set to true only after
# confirming the token has the required project-level permission.
sonar.qualitygate.wait=false

sonar.sources=src
sonar.test.inclusions=src/__tests__/**,tests/**
sonar.tests=src/__tests__,tests

sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=\
**/__tests__/**,\
**/*.test.ts,\
**/*.spec.ts

sonar.sourceEncoding=UTF-8
