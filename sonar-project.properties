sonar.projectKey=quotii
sonar.projectName=Quotii

sonar.sources=quotiiBackend/src,quotiiPdfProcessor
sonar.tests=quotiiBackend/src/__tests__,quotiiBackend/tests,quotiiPdfProcessor/tests

sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/.venv/**,\
**/__pycache__/**,\
**/coverage/**,\
**/test-results/**

sonar.javascript.lcov.reportPaths=quotiiBackend/coverage/lcov.info
sonar.python.coverage.reportPaths=quotiiPdfProcessor/coverage.xml

sonar.coverage.exclusions=\
**/tests/**,\
**/__tests__/**,\
**/*.test.ts,\
**/*.spec.ts

sonar.sourceEncoding=UTF-8
