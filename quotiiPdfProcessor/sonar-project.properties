# ---------------------------------------------------------------
# SonarCloud project for quotiiPdfProcessor (Python / FastAPI)
#
# Required: set these two values in SonarCloud before first run.
#   sonar.organization  — your SonarCloud organization key
#   sonar.projectKey    — the project key you created in SonarCloud
#                         for this service (e.g. <org>_quotii-pdf-processor)
# ---------------------------------------------------------------
sonar.organization=jujistu
sonar.projectKey=jujistu_quoti-python
sonar.projectName=Quotii PDF Processor

sonar.qualitygate.wait=true

sonar.sources=services,app.py,worker.py,run.py
sonar.tests=tests

sonar.exclusions=\
**/.venv/**,\
**/__pycache__/**,\
**/coverage/**

sonar.python.coverage.reportPaths=coverage.xml

sonar.coverage.exclusions=\
**/tests/**

sonar.sourceEncoding=UTF-8
